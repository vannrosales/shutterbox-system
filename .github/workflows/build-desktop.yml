name: Build Desktop Application

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-tauri:
    name: Build Tauri App (${{ matrix.target }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            target: 'macOS'
          - platform: 'windows-latest'
            target: 'Windows'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, sqlite3, pdo_sqlite, bcmath, ctype, fileinfo, json, tokenizer, xml
          tools: composer:v2

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust Build Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Composer Dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Install NPM Dependencies
        run: npm install

      - name: Prepare Laravel Production Environment
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          php artisan migrate --force

      - name: Build Frontend Assets
        run: npm run build

      - name: Prepare Offline Bundle Resources (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "src-tauri/resources/bin"
          New-Item -ItemType Directory -Force -Path "src-tauri/resources/app"
          $phpDir = Split-Path (Get-Command php.exe).Path
          Copy-Item -Path "$phpDir\*" -Destination "src-tauri/resources/bin" -Recurse -Force
          Copy-Item -Path "app","bootstrap","config","database","public","resources","routes","storage","vendor","artisan",".env" -Destination "src-tauri/resources/app" -Recurse -Force

      - name: Prepare Offline Bundle Resources (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p src-tauri/resources/bin
          mkdir -p src-tauri/resources/app
          cp $(which php) src-tauri/resources/bin/php
          cp -R app bootstrap config database public resources routes storage vendor artisan .env src-tauri/resources/app/

      - name: Build Tauri Desktop Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'Shutterbox Desktop v__VERSION__'
          releaseBody: 'Automated release build for Shutterbox System desktop application.'
          releaseDraft: true
          prerelease: false

      - name: Build Electron Desktop Application
        run: npm run electron:build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Desktop Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shutterbox-desktop-${{ matrix.target }}
          path: |
            dist-desktop/*.dmg
            dist-desktop/*.exe
            dist-desktop/*.zip
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn
