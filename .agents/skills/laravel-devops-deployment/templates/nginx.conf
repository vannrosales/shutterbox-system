# ═══════════════════════════════════════════════════════════════════════════
#  Nginx site configuration for Laravel.
#  /etc/nginx/sites-available/app  →  symlink into sites-enabled/
# ═══════════════════════════════════════════════════════════════════════════

# Rate-limit zones. Declared at http level — put these in nginx.conf or a
# conf.d/ file if you have several sites.
limit_req_zone  $binary_remote_addr zone=general:10m rate=30r/s;
limit_req_zone  $binary_remote_addr zone=login:10m   rate=2r/m;
limit_conn_zone $binary_remote_addr zone=conns:10m;

# ── HTTP → HTTPS ───────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    # Certbot renewal must reach this
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / { return 301 https://example.com$request_uri; }
}

# ── www → apex ─────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name www.example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    return 301 https://example.com$request_uri;
}

# ── Main site ──────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.com;

    # NEVER the project root — that exposes .env, storage/, and vendor/ to
    # anyone who guesses the path.
    root /var/www/app/current/public;

    index index.php;
    charset utf-8;

    # ── TLS ─────────────────────────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/example.com/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;          # let modern clients choose
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;

    # ── Limits ──────────────────────────────────────────────────────────────
    # The timeouts are the Slowloris defence: without them a handful of slow
    # connections exhausts every worker slot.
    client_max_body_size  12m;      # must be >= PHP post_max_size
    client_body_timeout   10s;
    client_header_timeout 10s;
    send_timeout          10s;
    keepalive_timeout     30s;

    limit_req  zone=general burst=50 nodelay;
    limit_conn conns 20;
    limit_req_status 429;
    limit_conn_status 429;

    # ── Compression ─────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml+rss
        application/atom+xml image/svg+xml;

    # Brotli beats gzip by ~15-20% on text. Serve both; browsers negotiate.
    brotli on;
    brotli_comp_level 6;
    brotli_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml+rss
        image/svg+xml;

    # ── Security headers ────────────────────────────────────────────────────
    # CSP is set by the application (it needs a per-request nonce) — see
    # laravel-security. These are the static ones.
    add_header X-Content-Type-Options    "nosniff"                        always;
    add_header X-Frame-Options           "DENY"                           always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # ── Routing ─────────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Auth endpoints get a much tighter limit — this is the credential-stuffing
    # defence at the edge, before PHP boots.
    location ~ ^/(login|register|password|forgot-password) {
        limit_req zone=login burst=3 nodelay;
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_index index.php;

        # $realpath_root, not $document_root — required for symlink deploys, or
        # OPcache keeps serving the previous release's files.
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT   $realpath_root;
        include fastcgi_params;

        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # ── Private file delivery ───────────────────────────────────────────────
    # `internal` means this path CANNOT be requested directly — only Nginx
    # acting on an X-Accel-Redirect header from an authorized controller can
    # serve it. Authorization in PHP, transfer at Nginx speed.
    location /protected/ {
        internal;
        alias /var/www/app/shared/storage/app/private/;
    }

    # ── Static assets ───────────────────────────────────────────────────────
    # Vite emits content-hashed filenames, so these are safe to cache forever.
    location ~* \.(?:css|js|jpg|jpeg|png|gif|webp|avif|svg|ico|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ── Deny dotfiles, but allow ACME ───────────────────────────────────────
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    # PHP-FPM status, localhost only
    location ~ ^/(fpm-status|fpm-ping)$ {
        allow 127.0.0.1;
        deny all;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        include fastcgi_params;
    }

    access_log /var/log/nginx/app-access.log;
    error_log  /var/log/nginx/app-error.log warn;
}

# ═══════════════════════════════════════════════════════════════════════════
#  Behind a CDN (Cloudflare, Fastly)
# ═══════════════════════════════════════════════════════════════════════════
#
# Two additions are BOTH required:
#
#   1. Lock the origin down. If an attacker finds the origin IP, they bypass
#      every protection you pay the CDN for.
#
#        allow 173.245.48.0/20;
#        # ... full published range ...
#        deny all;
#
#   2. Restore the real client IP. Without it every request appears to come
#      from the CDN, so application rate limiting blocks everyone or nobody.
#
#        set_real_ip_from 173.245.48.0/20;
#        real_ip_header CF-Connecting-IP;
#
# Also set trustProxies in bootstrap/app.php, or every generated URL is http://.
#
# ═══════════════════════════════════════════════════════════════════════════
#  Verify
# ═══════════════════════════════════════════════════════════════════════════
#
#   sudo nginx -t && sudo systemctl reload nginx
#
#   curl -I https://example.com | grep -iE 'strict-transport|x-frame|x-content'
#   curl -s -o /dev/null -w '%{http_code}\n' https://example.com/.env    # 403/404
#   curl -s -o /dev/null -w '%{http_code}\n' https://example.com/storage/logs/laravel.log
#
# ═══════════════════════════════════════════════════════════════════════════
