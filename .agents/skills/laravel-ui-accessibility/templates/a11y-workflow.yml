> Copy to `.github/workflows/accessibility.yml`.
> Gates the build on automated accessibility violations. Automated checks catch ~35% of
> issues — keep the manual keyboard and screen-reader passes in the release checklist.

```yaml
name: Accessibility

on:
  pull_request:
  push:
    branches: [main]

jobs:
  a11y:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: testing
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping" --health-interval=10s
          --health-timeout=5s --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, intl, gd
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install Node dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan migrate --seed --force
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_DATABASE: testing
          DB_USERNAME: root
          DB_PASSWORD: ''

      - name: Serve application
        run: php artisan serve --port=8000 &
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_DATABASE: testing
          DB_USERNAME: root

      - name: Wait for server
        run: npx wait-on http://127.0.0.1:8000 --timeout 60000

      # ── Public pages ────────────────────────────────────────────────────────
      - name: axe-core scan
        run: |
          npx @axe-core/cli \
            http://127.0.0.1:8000/ \
            http://127.0.0.1:8000/register \
            http://127.0.0.1:8000/login \
            --tags wcag2a,wcag2aa,wcag21a,wcag21aa,wcag22aa \
            --exit

      # ── Authenticated pages — where the real defects live ───────────────────
      - name: pa11y-ci (includes authenticated routes)
        run: npx pa11y-ci --config .pa11yci.json

      - name: Lighthouse accessibility budget
        run: |
          npx lighthouse http://127.0.0.1:8000 \
            --only-categories=accessibility \
            --output=json --output-path=./lighthouse.json \
            --chrome-flags="--headless --no-sandbox"
          score=$(node -e "console.log(require('./lighthouse.json').categories.accessibility.score * 100)")
          echo "Accessibility score: $score"
          if (( $(echo "$score < 95" | bc -l) )); then
            echo "::error::Lighthouse accessibility score $score is below the 95 threshold"
            exit 1
          fi

      - name: HTML validity (structure that a11y depends on)
        run: |
          npx html-validate "resources/views/**/*.blade.php" || true
          # Blade is not valid HTML on its own; validate rendered output instead:
          curl -s http://127.0.0.1:8000/ > /tmp/home.html
          npx html-validate /tmp/home.html

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-reports
          path: |
            lighthouse.json
            pa11y-results/
```

## `.pa11yci.json`

```json
{
  "defaults": {
    "standard": "WCAG2AA",
    "runners": ["axe", "htmlcs"],
    "timeout": 30000,
    "chromeLaunchConfig": { "args": ["--no-sandbox", "--disable-dev-shm-usage"] },
    "ignore": [],
    "hideElements": "#third-party-embed"
  },
  "urls": [
    "http://127.0.0.1:8000/",
    "http://127.0.0.1:8000/register",
    "http://127.0.0.1:8000/accessibility",
    {
      "url": "http://127.0.0.1:8000/dashboard",
      "actions": [
        "navigate to http://127.0.0.1:8000/login",
        "set field #email to test@example.com",
        "set field #password to password",
        "click element button[type=submit]",
        "wait for path to be /dashboard"
      ]
    }
  ]
}
```

## Notes

- **Do not add rules to `ignore`** to make the build green. Fix the violation, or record
  it in the accessibility statement's "known limitations" with an owner and a date.
- The Lighthouse threshold is a floor, not a target. A score of 100 still means only the
  automatable third was checked.
- Run the manual passes (`references/testing-a11y.md` layers 2 and 3) before each release,
  and record the results.
