; ═══════════════════════════════════════════════════════════════════════════
;  Supervisor configuration for Laravel queue workers, Horizon, and scheduler.
;
;  Install to /etc/supervisor/conf.d/, then:
;      sudo supervisorctl reread
;      sudo supervisorctl update
;      sudo supervisorctl status
;
;  A worker that dies silently is a queue that stops. Everything here exists
;  to make that impossible.
; ═══════════════════════════════════════════════════════════════════════════

; ── Option A: Horizon (Redis queues) ────────────────────────────────────────
; Preferred for Redis. Gives metrics, failure tracking, auto-balancing, and
; per-queue worker configuration from config/horizon.php.
;
; Horizon and manual queue:work are ALTERNATIVES, not complements — never run
; both against the same queues.

[program:laravel-horizon]
process_name=%(program_name)s
command=php /var/www/app/current/artisan horizon
directory=/var/www/app/current
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/supervisor/horizon.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5

; MUST exceed the longest job timeout, or Supervisor kills a worker mid-job
; during a restart.
stopwaitsecs=3600

; Horizon needs SIGTERM to shut its own supervisors down gracefully.
stopsignal=TERM


; ── Option B: manual workers (no Horizon, or a non-Redis driver) ────────────
; Comment out the Horizon block above if you use this.

;[program:laravel-worker-high]
;process_name=%(program_name)s_%(process_num)02d
;command=php /var/www/app/current/artisan queue:work redis --queue=high --sleep=1 --tries=3 --max-time=3600 --max-jobs=1000
;directory=/var/www/app/current
;autostart=true
;autorestart=true
;stopasgroup=true
;killasgroup=true
;user=www-data
;numprocs=2
;redirect_stderr=true
;stdout_logfile=/var/log/supervisor/worker-high.log
;stopwaitsecs=3600

;[program:laravel-worker-default]
;process_name=%(program_name)s_%(process_num)02d
;command=php /var/www/app/current/artisan queue:work redis --queue=default,media --sleep=3 --tries=3 --max-time=3600
;directory=/var/www/app/current
;autostart=true
;autorestart=true
;stopasgroup=true
;killasgroup=true
;user=www-data
;numprocs=4
;redirect_stderr=true
;stdout_logfile=/var/log/supervisor/worker-default.log
;stopwaitsecs=3600

; Long-running work on its own supervisor: without separation, one 10-minute
; report blocks every password-reset email behind it.
;[program:laravel-worker-reports]
;command=php /var/www/app/current/artisan queue:work redis --queue=reports --sleep=5 --tries=1 --timeout=1800 --max-time=3600
;directory=/var/www/app/current
;autostart=true
;autorestart=true
;user=www-data
;numprocs=1
;stopwaitsecs=1900          ; > the 1800s job timeout


; ── Scheduler (containers, or where cron is unavailable) ────────────────────
; On a normal server, prefer ONE crontab entry:
;
;   * * * * * cd /var/www/app/current && php artisan schedule:run >> /dev/null 2>&1
;
; EXACTLY ONE instance, ever. Two schedulers means every scheduled job runs
; twice — including billing.

;[program:laravel-scheduler]
;command=php /var/www/app/current/artisan schedule:work
;directory=/var/www/app/current
;autostart=true
;autorestart=true
;user=www-data
;numprocs=1
;redirect_stderr=true
;stdout_logfile=/var/log/supervisor/scheduler.log


; ── Reverb / WebSockets, if used ────────────────────────────────────────────

;[program:laravel-reverb]
;command=php /var/www/app/current/artisan reverb:start --host=0.0.0.0 --port=8080
;directory=/var/www/app/current
;autostart=true
;autorestart=true
;user=www-data
;numprocs=1
;stdout_logfile=/var/log/supervisor/reverb.log


; ── Group, so one command controls everything ───────────────────────────────

[group:laravel]
programs=laravel-horizon
priority=999


; ═══════════════════════════════════════════════════════════════════════════
;  Notes that prevent the common failures
; ═══════════════════════════════════════════════════════════════════════════
;
;  stopwaitsecs
;      Must exceed the longest job timeout. Too low and Supervisor SIGKILLs a
;      worker mid-job on every deploy, leaving half-finished work.
;
;  retry_after (config/queue.php)
;      Must EXCEED the longest job timeout, or a job is retried while still
;      running. This produces duplicate execution — the most confusing class
;      of queue bug there is.
;
;          'redis' => ['retry_after' => 1900],   // > the 1800s reports timeout
;
;  --max-time / --max-jobs
;      Recycle workers to bound memory growth. A worker that runs for a week
;      accumulates leaks from every package in the stack.
;
;  queue:restart
;      queue:work boots the framework ONCE and keeps it in memory. Without
;      `php artisan queue:restart` in the deploy script, workers run the old
;      code indefinitely. This is the #1 "my fix isn't live" cause.
;
;  Queue separation
;      Give latency-sensitive work (password resets, OTP, payment webhooks)
;      its own supervisor. Without it, a long report starves them.
;
;  Commands
;      sudo supervisorctl reread
;      sudo supervisorctl update
;      sudo supervisorctl restart laravel:*
;      sudo supervisorctl status
;      sudo supervisorctl tail -f laravel-horizon
;
;  Monitoring
;      Alert on: process not RUNNING, queue depth, oldest job age, failed job
;      count. A supervisor that gave up after `startretries` is silent
;      otherwise.
; ═══════════════════════════════════════════════════════════════════════════
